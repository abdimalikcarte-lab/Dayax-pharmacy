<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova Pharmacy – Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f7f4;--card:#fff;--ink:#0f2a22;--mut:#5b7469;--line:#d5e5de;--pri:#059669;--prid:#047857;--prif:#fff;--soft:#d1fae5;--warn:#b45309;--bad:#b91c1c;--ok:#047857;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08130f;--card:#10231c;--ink:#e4f3ec;--mut:#86a597;--line:#1f382e;--pri:#10b981;--prid:#065f46;--prif:#03130d;--soft:#0f3a2b;--warn:#fbbf24;--bad:#f87171;--ok:#34d399}}
:root[data-theme="dark"]{--bg:#08130f;--card:#10231c;--ink:#e4f3ec;--mut:#86a597;--line:#1f382e;--pri:#10b981;--prid:#065f46;--prif:#03130d;--soft:#0f3a2b;--warn:#fbbf24;--bad:#f87171;--ok:#34d399}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,sans-serif;padding-bottom:24px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--prid);color:#fff}header b{font-size:17px;font-weight:800}header small{opacity:.85;display:block;font-size:12px}
nav{position:sticky;top:0;z-index:5;display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:13px 12px;white-space:nowrap;font:600 14px Figtree,system-ui,sans-serif}nav button.on{color:var(--pri);box-shadow:inset 0 -3px var(--pri)}
main{padding:12px;max-width:960px;margin:auto}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;margin:4px 0 8px}
label{display:block;font-size:13px;color:var(--mut)}button{font:inherit;cursor:pointer}
.pri,.ghost,.sm{border-radius:8px;padding:10px 14px;border:1px solid var(--pri);font-weight:600}.pri{background:var(--pri);color:var(--prif)}.pri:disabled{opacity:.5}.ghost{background:none;color:var(--pri)}
.sm{padding:5px 10px;font-size:13px;background:none;color:var(--pri)}.sm.d{color:var(--bad);border-color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.item{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);display:flex;flex-direction:column;gap:2px}.item span{font-size:12px;color:var(--mut)}
.cat{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--ink);border-left:5px solid var(--pri)}.cat b{display:block;font-size:16px}.cat span{font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.mut{color:var(--mut)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid}.tag.bad{color:var(--bad)}.tag.warn{color:var(--warn)}.tag.ok{color:var(--ok)}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}@media(min-width:640px){.kpi{grid-template-columns:repeat(3,1fr)}}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.kpi small{color:var(--mut);font-size:12px}.kpi b{display:block;font-size:22px;font-weight:800}.kpi .hi{background:var(--pri);color:var(--prif);border:0}.kpi .hi small{color:inherit;opacity:.85}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin:10px 0 24px}.bars div{flex:1;background:var(--pri);border-radius:5px 5px 0 0;min-height:3px;position:relative}.bars small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut)}
.ln{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}.ln:last-child{border:0}
.meter{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:var(--pri)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0;padding-bottom:4px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font:600 13px Figtree,system-ui,sans-serif}.chip.on{background:var(--pri);color:var(--prif);border-color:var(--pri)}
h3,h4{margin:6px 0}dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(92vw,420px);padding:16px}dialog::backdrop{background:#0008}
.big{font-size:22px;font-weight:800}.login{max-width:360px;margin:10vh auto;padding:18px}.login h1{margin:0 0 4px;color:var(--pri)}
@media print{body>*:not(dialog){display:none!important}dialog{border:0;width:100%}.noprint{display:none}}
</style></head><body>
<div id="app"></div><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),m=n=>'$'+(+n||0).toFixed(2),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10),today=()=>iso(0),KEY='nova_pharmacy_v2';
let db=null,user=null,tab='dash',oc=null,cart=[],q='',pq='',pc='',disc='',paid='',cu='',sv='new',period='today';
function seed(){const d={shop:'Nova Pharmacy',cats:['Painkillers','Antibiotics','Vitamins & Supplements','Cough & Cold','Digestive'],products:[],sales:[],expenses:[{id:uid(),t:today(),note:'Shop rent',amt:150},{id:uid(),t:today(),note:'Electricity',amt:35}],
customers:[{id:uid(),name:'Ahmed Ali',phone:'0634 000 111',debt:12.5},{id:uid(),name:'Fadumo Hassan',phone:'0634 000 222',debt:0},{id:uid(),name:'Hodan Warsame',phone:'0634 000 333',debt:4.2}],
users:[{id:'u1',name:'Admin',role:'admin',pin:'1234'},{id:'u2',name:'Cashier',role:'cashier',pin:'0000'}]};
[['Paracetamol 500mg','Painkillers',.04,.12,420,100,420],['Ibuprofen 400mg','Painkillers',.07,.2,260,80,300],['Diclofenac 50mg','Painkillers',.09,.28,60,80,25],['Aspirin 100mg','Painkillers',.03,.1,150,60,500],
['Amoxicillin 500mg','Antibiotics',.18,.45,180,60,210],['Azithromycin 500mg','Antibiotics',.55,1.3,45,50,380],['Ciprofloxacin 500mg','Antibiotics',.2,.55,90,40,55],['Metronidazole 400mg','Antibiotics',.06,.18,35,50,-12],
['Vitamin C 1000mg','Vitamins & Supplements',.1,.3,200,50,330],['Multivitamin','Vitamins & Supplements',.12,.35,18,30,460],['Zinc 20mg','Vitamins & Supplements',.08,.22,95,40,270],
['Cough Syrup 100ml','Cough & Cold',1.1,2.4,40,20,140],['Loratadine 10mg','Cough & Cold',.05,.16,310,60,500],['Throat Lozenges','Cough & Cold',.4,.9,22,30,60],
['Omeprazole 20mg','Digestive',.07,.22,300,80,240],['ORS Sachet','Digestive',.15,.4,120,50,380],['Antacid Tablets','Digestive',.05,.15,15,50,200]].forEach(a=>d.products.push({id:uid(),name:a[0],cat:a[1],cost:a[2],price:a[3],qty:a[4],min:a[5],exp:iso(a[6]),batch:'B'+(100+Math.floor(Math.random()*900))}));
for(let k=0;k<7;k++)for(let j=0;j<(k?3:4);j++){const items=[];for(let n=0;n<1+Math.floor(Math.random()*3);n++){const p=d.products[Math.floor(Math.random()*d.products.length)];if(p.qty<30||items.find(i=>i.id===p.id))continue;const c=1+Math.floor(Math.random()*4);p.qty-=c;items.push({id:p.id,name:p.name,cat:p.cat,q:c,p:p.price,c:p.cost})}
if(!items.length)continue;const t=items.reduce((s,i)=>s+i.q*i.p,0),dt=new Date(Date.now()-k*864e5);dt.setUTCHours(6+j*3,10+j*7);d.sales.push({id:uid(),t:dt.toISOString(),items,disc:0,total:t,paid:t,cust:'',by:'Cashier'})}
return d}
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!db.products){db=seed()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const P=id=>db.products.find(p=>p.id===id),C=id=>db.customers.find(c=>c.id===id),adm=()=>user&&user.role==='admin';
const dleft=p=>p.exp?Math.round((new Date(p.exp)-new Date(today()))/864e5):9999;
const rev=S=>S.reduce((a,s)=>a+s.total,0),prof=S=>S.reduce((a,s)=>a+s.items.reduce((x,i)=>x+(i.p-i.c)*i.q,0)-s.disc,0),onDay=d=>db.sales.filter(s=>s.t.slice(0,10)===d);
const stat=p=>{const d=dleft(p);return d<0?'<span class="tag bad">Expired</span>':d<=60?`<span class="tag warn">Expires in ${d}d</span>`:p.qty<=p.min?'<span class="tag warn">Low stock</span>':'<span class="tag ok">In stock</span>'};
const sub=()=>cart.reduce((s,l)=>s+l.q*P(l.id).price,0),total=()=>Math.max(0,sub()-(+disc||0));
function form(title,fields,cb){const d=$('#dlg');d.innerHTML=`<form method="dialog" id="f"><h3>${title}</h3>${fields.map(f=>f.o?`<label>${f.l}<select name="${f.k}">${f.o.map(o=>`<option ${o===f.v?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`:`<label>${f.l}<input name="${f.k}" type="${f.t||'text'}" value="${esc(f.v)}" step="any" ${f.r?'required':''}></label>`).join('')}<div class="row"><button value="x" formnovalidate class="ghost">Cancel</button><button class="pri">Save</button></div></form>`;d.showModal();$('#f').onsubmit=e=>{if(e.submitter.value==='x')return;cb(Object.fromEntries(new FormData(e.target)))}}
function show(html){const d=$('#dlg');d.innerHTML=html+'<div class="row noprint" style="margin-top:12px"><button class="ghost" onclick="$(\'#dlg\').close()">Close</button><button class="pri" onclick="print()">Print</button></div>';d.showModal()}
const go=t=>{tab=t;oc=null;render()};
function render(){$('#app').innerHTML=user?shell():`<div class="login card"><h1>${esc(db.shop)}</h1><p class="mut">Pharmacy management system. Sign in to continue.</p><label>User<select id="u">${db.users.map(u=>`<option value="${u.id}">${esc(u.name)} (${u.role})</option>`).join('')}</select></label><label>PIN<input id="pin" type="password" inputmode="numeric" placeholder="PIN"></label><button class="pri" style="width:100%" onclick="login()">Sign in</button><p class="mut" style="font-size:12px">Demo PINs: Admin 1234 · Cashier 0000</p></div>`}
function login(){const u=db.users.find(x=>x.id===$('#u').value);if(u&&$('#pin').value===u.pin){user=u;tab=u.role==='admin'?'dash':'sales';oc=null;render()}else alert('Incorrect PIN')}
function shell(){const T=adm()?[['dash','Dashboard'],['sales','Sales'],['cats','Categories'],['cust','Customers'],['rep','Reports'],['set','Settings']]:[['sales','Sales'],['cats','Medicines'],['cust','Customers']];
return`<header><div><b>${esc(db.shop)}</b><small>${esc(user.name)} · ${adm()?'Administrator':'Cashier'}</small></div><button class="sm" style="color:#fff;border-color:#fff8" onclick="user=null;cart=[];render()">Sign out</button></header><nav>${T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav><main>${V[tab]()}</main>`}
const V={};
/* ---------- Dashboard ---------- */
V.dash=()=>{const T=today(),S=onDay(T),Y=onDay(iso(-1)),r=rev(S),yr=rev(Y),dl=yr?Math.round((r-yr)/yr*100):null;
const exp=db.products.filter(p=>dleft(p)<=60).sort((a,b)=>dleft(a)-dleft(b)),low=db.products.filter(p=>p.qty<=p.min&&dleft(p)>60);
const days=[...Array(7)].map((_,i)=>{const d=iso(i-6);return[new Date(d).toLocaleDateString('en',{weekday:'short',timeZone:'UTC'}),rev(onDay(d))]}),mx=Math.max(1,...days.map(d=>d[1]));
const top={};db.sales.filter(s=>s.t.slice(0,10)>=iso(-6)).forEach(s=>s.items.forEach(i=>top[i.name]=(top[i.name]||0)+i.q));const tl=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
return`<div class="kpi"><div class="hi"><small>Today’s sales</small><b>${m(r)}</b><small>${dl===null?S.length+' orders':(dl>=0?'▲ ':'▼ ')+Math.abs(dl)+'% vs yesterday · '+S.length+' orders'}</small></div>
<div><small>Today’s profit</small><b>${m(prof(S))}</b></div><div><small>Receivables</small><b>${m(db.customers.reduce((a,c)=>a+c.debt,0))}</b></div>
<div><small>Stock value (cost)</small><b>${m(db.products.reduce((a,p)=>a+p.qty*p.cost,0))}</b></div><div><small>Low stock items</small><b style="color:var(--warn)">${db.products.filter(p=>p.qty<=p.min).length}</b></div><div><small>Expired / expiring</small><b style="color:var(--bad)">${exp.length}</b></div></div>
<div class="card"><b>Sales – last 7 days</b><div class="bars">${days.map(d=>`<div style="height:${d[1]/mx*100}%" title="${m(d[1])}"><small>${d[0]}</small></div>`).join('')}</div></div>
<div class="card"><div class="row"><b>Alerts</b><button class="sm" onclick="go('cats')">Open categories</button></div>${exp.concat(low).slice(0,7).map(p=>`<div class="ln"><span>${esc(p.name)}<br><small class="mut">${esc(p.cat)} · ${p.qty} left</small></span>${stat(p)}</div>`).join('')||'<p class="mut">No alerts. Everything looks healthy.</p>'}</div>
<div class="card"><b>Top sellers (7 days)</b>${tl.map(t=>`<div class="ln"><span>${esc(t[0])}</span><b>${t[1]} units</b></div>`).join('')||'<p class="mut">No sales yet</p>'}</div>
<div class="card"><div class="row"><b>Recent sales</b><button class="sm" onclick="sv='hist';go('sales')">View all</button></div>${[...db.sales].reverse().slice(0,5).map(s=>`<div class="ln" onclick="receipt('${s.id}')"><span>${new Date(s.t).toLocaleString('en',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}<br><small class="mut">${esc(s.by)} · ${s.items.length} item(s)</small></span><b>${m(s.total)}</b></div>`).join('')||'<p class="mut">No sales yet</p>'}</div>`};
/* ---------- Sales ---------- */
const resHtml=()=>db.products.filter(p=>p.qty>0&&dleft(p)>=0&&(!pc||p.cat===pc)&&(!q||(p.name+(p.barcode||'')).toLowerCase().includes(q.toLowerCase()))).slice(0,24).map(p=>`<button class="item" onclick="add('${p.id}')"><b>${esc(p.name)}</b><span>${m(p.price)} · ${p.qty} in stock</span></button>`).join('')||'<p class="mut">No medicines found</p>';
V.sales=()=>`<div class="chips"><button class="chip ${sv==='new'?'on':''}" onclick="sv='new';render()">New sale</button><button class="chip ${sv==='hist'?'on':''}" onclick="sv='hist';render()">Sales history</button></div>`+(sv==='hist'?hist():`<div class="chips"><button class="chip ${!pc?'on':''}" onclick="pc='';render()">All</button>${db.cats.map((c,i)=>`<button class="chip ${pc===c?'on':''}" onclick="pc=db.cats[${i}];render()">${esc(c)}</button>`).join('')}</div>
<input id="q" placeholder="Search medicine or barcode…" value="${esc(q)}" oninput="q=this.value;$('#res').innerHTML=resHtml()"><div id="res" class="grid">${resHtml()}</div>
<div class="card"><b>Current sale</b>${cart.map(l=>{const p=P(l.id);return`<div class="ln"><span>${esc(p.name)}<br><small class="mut">${m(p.price)} each</small></span><span><button class="sm" onclick="qty('${l.id}',-1)">−</button> ${l.q} <button class="sm" onclick="qty('${l.id}',1)">+</button></span><b>${m(l.q*p.price)}</b></div>`}).join('')||'<p class="mut">Cart is empty. Tap a medicine to add it.</p>'}
<label>Discount ($)<input type="number" step="any" value="${esc(disc)}" onchange="disc=this.value;render()"></label>
<label>Customer (required for credit)<select onchange="cu=this.value;render()"><option value="">Walk-in (cash)</option>${db.customers.map(c=>`<option value="${c.id}" ${cu===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
<label>Amount paid (blank = paid in full)<input type="number" step="any" value="${esc(paid)}" onchange="paid=this.value;render()"></label>
<div class="row"><span class="big">${m(total())}</span><button class="pri" onclick="checkout()" ${cart.length?'':'disabled'}>Complete sale</button></div></div>`);
const hist=()=>[...db.sales].reverse().slice(0,60).map(s=>`<div class="card ln" onclick="receipt('${s.id}')"><span><b>#${s.id}</b> · ${new Date(s.t).toLocaleString('en',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}<br><small class="mut">${esc(s.by)} · ${s.items.length} item(s)${s.total>s.paid+.001?' · on credit':''}</small></span><b>${m(s.total)}</b></div>`).join('')||'<p class="mut">No sales yet</p>';
function add(id){const p=P(id),l=cart.find(x=>x.id===id);if(l){if(l.q<p.qty)l.q++}else cart.push({id,q:1});render()}
function qty(id,d){const l=cart.find(x=>x.id===id),p=P(id);l.q=Math.min(p.qty,l.q+d);if(l.q<=0)cart=cart.filter(x=>x!==l);render()}
function checkout(){const t=total(),pd=paid===''?t:+paid;if(pd<t&&!cu)return alert('Select a customer to record the remaining balance as credit');
const items=cart.map(l=>{const p=P(l.id);p.qty-=l.q;return{id:p.id,name:p.name,cat:p.cat,q:l.q,p:p.price,c:p.cost}});
const s={id:uid(),t:new Date().toISOString(),items,disc:+disc||0,total:t,paid:Math.min(pd,t),cust:cu,by:user.name};
if(pd<t)C(cu).debt+=t-pd;db.sales.push(s);save();cart=[];disc=paid=cu='';render();receipt(s.id)}
function receipt(id){const s=db.sales.find(x=>x.id===id),c=C(s.cust);show(`<div style="text-align:center"><h3 style="margin:0">${esc(db.shop)}</h3><small class="mut">${new Date(s.t).toLocaleString()} · #${s.id} · ${esc(s.by)}</small></div>${s.items.map(i=>`<div class="ln"><span>${esc(i.name)} ×${i.q}</span><span>${m(i.q*i.p)}</span></div>`).join('')}${s.disc?`<div class="ln"><span>Discount</span><span>−${m(s.disc)}</span></div>`:''}<div class="ln"><b>Total</b><b>${m(s.total)}</b></div><div class="ln"><span>Paid</span><span>${m(s.paid)}</span></div>${s.total>s.paid+.001?`<div class="ln"><span>Balance (${esc(c?c.name:'')})</span><b>${m(s.total-s.paid)}</b></div>`:''}<p style="text-align:center" class="mut">Thank you!</p>`)}
/* ---------- Categories & medicines ---------- */
V.cats=()=>oc?medView():`<div class="row"><h3>${adm()?'Categories':'Medicines by category'}</h3>${adm()?'<button class="pri" onclick="newCat()">+ Category</button>':''}</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">${db.cats.map((c,i)=>{const L=db.products.filter(p=>p.cat===c),w=L.filter(p=>dleft(p)<=60||p.qty<=p.min).length;return`<button class="cat" onclick="oc=db.cats[${i}];render()"><b>${esc(c)}</b><span>${L.length} medicines${adm()?' · '+m(L.reduce((a,p)=>a+p.qty*p.cost,0)):''}</span><br>${w?`<span class="tag warn">${w} need attention</span>`:'<span class="tag ok">All good</span>'}</button>`}).join('')}</div>`;
function medView(){const L=db.products.filter(p=>p.cat===oc&&(!pq||p.name.toLowerCase().includes(pq.toLowerCase())));
return`<div class="row"><button class="sm" onclick="oc=null;pq='';render()">← All categories</button>${adm()?`<span><button class="pri" onclick="prod()">+ Medicine</button> <button class="sm d" onclick="delCat()">Delete</button></span>`:''}</div><h3>${esc(oc)}</h3>
<input placeholder="Search in ${esc(oc)}…" value="${esc(pq)}" oninput="pq=this.value;$('#pl').innerHTML=pl()"><div id="pl">${pl()}</div>`}
function pl(){const L=db.products.filter(p=>p.cat===oc&&(!pq||p.name.toLowerCase().includes(pq.toLowerCase())));return L.map(p=>`<div class="card"><div class="row"><b>${esc(p.name)}</b>${stat(p)}</div><div class="mut" style="font-size:13px">In stock: <b>${p.qty}</b> · Price ${m(p.price)}${adm()?' · Cost '+m(p.cost):''}${p.batch?' · Batch '+esc(p.batch):''}${p.exp?' · Exp '+p.exp:''}${adm()&&p.sup?' · '+esc(p.sup):''}</div><div class="row" style="margin-top:8px">${adm()?`<span><button class="sm" onclick="restock('${p.id}')">+ Stock</button> <button class="sm" onclick="prod('${p.id}')">Edit</button></span><button class="sm d" onclick="delP('${p.id}')">Delete</button>`:`<button class="sm" ${p.qty<1||dleft(p)<0?'disabled':''} onclick="tab='sales';sv='new';add('${p.id}')">Add to sale</button>`}</div></div>`).join('')||'<p class="mut">No medicines in this category yet.</p>'}
function newCat(){form('New category',[{k:'n',l:'Category name (e.g. Antimalarials)',r:1}],d=>{if(!db.cats.includes(d.n))db.cats.push(d.n);save();render()})}
function delCat(){if(db.products.some(p=>p.cat===oc))return alert('Delete or move the medicines in this category first.');if(confirm('Delete category “'+oc+'”?')){db.cats=db.cats.filter(c=>c!==oc);oc=null;save();render()}}
function prod(id){const p=id?P(id):{};form(id?'Edit medicine':'New medicine',[{k:'name',l:'Name',v:p.name,r:1},{k:'cat',l:'Category',o:db.cats,v:p.cat||oc},{k:'barcode',l:'Barcode',v:p.barcode},{k:'batch',l:'Batch number',v:p.batch},{k:'sup',l:'Supplier',v:p.sup},{k:'cost',l:'Cost price',t:'number',v:p.cost,r:1},{k:'price',l:'Selling price',t:'number',v:p.price,r:1},{k:'qty',l:'Quantity',t:'number',v:p.qty??0,r:1},{k:'min',l:'Low-stock alert level',t:'number',v:p.min??20},{k:'exp',l:'Expiry date',t:'date',v:p.exp}],d=>{const o={...d,cost:+d.cost,price:+d.price,qty:+d.qty,min:+d.min};if(id)Object.assign(p,o);else db.products.push({id:uid(),...o});save();render()})}
function restock(id){const p=P(id);form('Receive stock: '+esc(p.name),[{k:'q',l:'Quantity received',t:'number',r:1},{k:'cost',l:'Unit cost',t:'number',v:p.cost},{k:'sup',l:'Supplier',v:p.sup},{k:'batch',l:'New batch number',v:p.batch},{k:'exp',l:'Expiry date of new batch',t:'date',v:p.exp}],d=>{p.qty+=+d.q;p.cost=+d.cost||p.cost;p.sup=d.sup;p.batch=d.batch;if(d.exp)p.exp=d.exp;save();render()})}
function delP(id){if(confirm('Delete this medicine?')){db.products=db.products.filter(p=>p.id!==id);save();render()}}
/* ---------- Customers ---------- */
V.cust=()=>`<div class="row"><b>Receivables: ${m(db.customers.reduce((s,c)=>s+c.debt,0))}</b><button class="pri" onclick="newC()">+ Customer</button></div><div style="height:8px"></div>${db.customers.map(c=>`<div class="card row"><span><b>${esc(c.name)}</b><br><small class="mut">${esc(c.phone||'')}</small></span><span style="text-align:right"><b style="color:${c.debt>0?'var(--bad)':'var(--ok)'}">${m(c.debt)}</b><br>${c.debt>0?`<button class="sm" onclick="pay('${c.id}')">Record payment</button>`:'<small class="mut">No balance</small>'}</span></div>`).join('')||'<p class="mut">No customers yet</p>'}`;
function newC(){form('New customer',[{k:'name',l:'Full name',r:1},{k:'phone',l:'Phone'}],d=>{db.customers.push({id:uid(),name:d.name,phone:d.phone,debt:0});save();render()})}
function pay(id){const c=C(id);form('Payment from '+esc(c.name),[{k:'a',l:'Amount received',t:'number',v:c.debt,r:1}],d=>{c.debt=Math.max(0,c.debt-+d.a);save();render()})}
/* ---------- Reports ---------- */
V.rep=()=>{const inP=t=>period==='all'||(period==='today'?t.slice(0,10)===today():t.slice(0,7)===today().slice(0,7));const S=db.sales.filter(s=>inP(s.t)),E=db.expenses.filter(e=>inP(e.t)),ex=E.reduce((a,e)=>a+e.amt,0),pr=prof(S);
const bc={};S.forEach(s=>s.items.forEach(i=>bc[i.cat||'Other']=(bc[i.cat||'Other']||0)+i.q*i.p));const cl=Object.entries(bc).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...cl.map(c=>c[1]));
return`<select onchange="period=this.value;render()"><option value="today" ${period==='today'?'selected':''}>Today</option><option value="month" ${period==='month'?'selected':''}>This month</option><option value="all" ${period==='all'?'selected':''}>All time</option></select>
<div class="kpi"><div class="hi"><small>Revenue</small><b>${m(rev(S))}</b></div><div><small>Gross profit</small><b>${m(pr)}</b></div><div><small>Expenses</small><b>${m(ex)}</b></div><div><small>Net profit</small><b style="color:${pr-ex>=0?'var(--ok)':'var(--bad)'}">${m(pr-ex)}</b></div></div>
<div class="card"><b>Revenue by category</b>${cl.map(c=>`<div style="margin-top:8px"><div class="row"><span>${esc(c[0])}</span><b>${m(c[1])}</b></div><div class="meter"><i style="width:${c[1]/mx*100}%"></i></div></div>`).join('')||'<p class="mut">No sales in this period</p>'}</div>
<div class="card"><div class="row"><b>Expenses</b><button class="sm" onclick="newE()">+ Expense</button></div>${[...E].reverse().map(e=>`<div class="ln"><span>${esc(e.note)}<br><small class="mut">${e.t}</small></span><b>${m(e.amt)}</b></div>`).join('')||'<p class="mut">No expenses in this period</p>'}</div>`};
function newE(){form('New expense',[{k:'note',l:'Description (rent, salary, electricity…)',r:1},{k:'amt',l:'Amount',t:'number',r:1}],d=>{db.expenses.push({id:uid(),t:today(),note:d.note,amt:+d.amt});save();render()})}
/* ---------- Settings ---------- */
V.set=()=>`<div class="card"><label>Pharmacy name<input id="sn" value="${esc(db.shop)}"></label><button class="pri" onclick="db.shop=$('#sn').value;save();render()">Save</button></div>
<div class="card"><div class="row"><b>Staff accounts</b><button class="sm" onclick="newU()">+ Staff</button></div>${db.users.map(u=>`<div class="ln"><span>${esc(u.name)} <small class="mut">(${u.role})</small></span><span><button class="sm" onclick="pinU('${u.id}')">Change PIN</button>${u.id!==user.id?` <button class="sm d" onclick="delU('${u.id}')">Remove</button>`:''}</span></div>`).join('')}</div>
<div class="card"><b>Backup & restore</b><p class="mut" style="font-size:13px">Copy this text to keep a backup. Paste a backup here and press Restore to load it.</p><textarea id="bk" rows="4">${esc(JSON.stringify(db))}</textarea><button class="ghost" onclick="restore()">Restore</button></div>
<div class="card"><button class="sm d" onclick="if(confirm('Reset everything to the sample data?')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}">Reset to sample data</button></div>`;
function newU(){form('New staff account',[{k:'name',l:'Name',r:1},{k:'role',l:'Role',o:['cashier','admin']},{k:'pin',l:'PIN (4+ digits)',r:1}],d=>{db.users.push({id:uid(),...d});save();render()})}
function pinU(id){const u=db.users.find(x=>x.id===id);form('New PIN for '+esc(u.name),[{k:'pin',l:'PIN',r:1}],d=>{u.pin=d.pin;save();render()})}
function delU(id){if(confirm('Remove this account?')){db.users=db.users.filter(u=>u.id!==id);save();render()}}
function restore(){try{const d=JSON.parse($('#bk').value);if(!d.products||!d.users)throw 0;db=d;save();render()}catch(e){alert('That backup text is not valid')}}
render();
</script></body></html>
